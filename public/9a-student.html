<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9А QR</title><style>body{background:#0f1a2b;color:#fff;font-family:system-ui;padding:20px}main{max-width:420px;margin:auto;background:#24344c;padding:24px;border-radius:16px}input,button{padding:13px;margin:7px 0;width:95%;border-radius:9px}button{background:#55d6ac;font-weight:bold;border:0}input{background:#101c2b;color:white;border:1px solid #52647b}</style></head><body><main><h1>9 «А» қатысу</h1><p>Өз логиніңізбен кіріңіз. Мұғалім растаған соң қатысу белгіленеді.</p><input id="login" placeholder="Логин"><input id="password" type="password" placeholder="Құпиясөз"><button id="enter">Кіру және QR растау</button><p id="status" role="status"></p></main><script>
document.getElementById('enter').onclick=async()=>{const out=document.getElementById('status');try{const challenge=location.hash.slice(1);if(!/^[a-f0-9]{64}$/.test(challenge))throw Error('Жарамды QR арқылы ашыңыз');const login=await fetch('/api/xp/student/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('login').value,password:document.getElementById('password').value})});const auth=await login.json();if(!login.ok)throw Error(auth.error||'Кіру қатесі');const response=await fetch('/api/xp/student/scan',{method:'POST',headers:{'Content-Type':'application/json','x-student-token':auth.token},body:JSON.stringify({challenge})});const result=await response.json();if(!response.ok)throw Error(result.error||'QR қатесі');out.textContent='Сұраныс қабылданды. Мұғалімнің растауын күтіңіз.'}catch(e){out.textContent=e.message}};
</script></body></html>
