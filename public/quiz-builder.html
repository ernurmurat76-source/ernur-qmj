<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#246bfd"><title>Е-Тапқыр — QR викторина</title><link rel="stylesheet" href="/styles.css"><style>
.quiz-page{background:#f5f8fd;min-height:100vh}.quiz-main{max-width:1180px;margin:auto;padding:45px 18px 100px}.quiz-head h1{font-size:clamp(34px,5vw,56px);margin:8px 0}.quiz-layout{display:grid;grid-template-columns:430px 1fr;gap:18px;align-items:start}.quiz-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(31,48,91,.06)}.quiz-form{display:grid;gap:14px}.quiz-ready{text-align:center}.quiz-ready img{width:min(300px,100%);border:10px solid #fff;box-shadow:0 8px 28px #dce5f5;border-radius:16px}.quiz-link{display:block;overflow-wrap:anywhere;margin:12px 0;color:var(--blue);font-weight:800}.quiz-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.quiz-actions button,.quiz-actions a{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;font-weight:800;color:var(--ink)}.ranking{margin-top:18px;text-align:left}.rank-row{display:grid;grid-template-columns:38px 1fr auto;gap:8px;padding:10px;border-bottom:1px solid var(--line)}@media(max-width:850px){.quiz-layout{grid-template-columns:1fr}}
</style></head><body class="quiz-page"><header class="header"><a class="brand" href="/"><span>ЕТ</span><strong>Е-Тарих</strong></a><nav><a href="/">Басты бет</a><a href="/tools.html">Құралдар</a><a href="/account.html">Жеке кабинет</a></nav></header><main class="quiz-main"><section class="quiz-head"><span class="badge">Е-Тапқыр</span><h1>QR-кодпен викторина жасаңыз</h1><p>Оқушылар телефоннан қосылып, нәтижесі автоматты есептеледі.</p></section><div class="quiz-layout"><form class="quiz-card quiz-form" id="quizForm"><label>Кіру коды<input id="accessCode" required placeholder="ERNUR-XXXXX-XXXXX"></label><div class="grid two"><label>Пән<select id="subject" required><option value="">Пәнді таңдаңыз</option></select></label><label>Сынып<select id="grade" required><option value="">Сыныпты таңдаңыз</option></select></label></div><label>Викторина атауы<input id="title" required placeholder="Мысалы: Қазақ хандығы"></label><label>Тақырып<textarea id="topic" rows="4" required placeholder="Тақырып пен қамтылатын ұғымдарды жазыңыз"></textarea></label><div class="grid two"><label>Сұрақ саны<input id="questionCount" type="number" min="3" max="30" value="10"></label><label>Қосымша талап<input id="requirements" placeholder="Күрделілік, уақыт"></label></div><p class="error" id="error"></p><button class="generate" id="createButton" type="submit">QR-викторина жасау</button></form><section class="quiz-card quiz-ready"><div id="placeholder"><h2>Викторина осы жерде шығады</h2><p>Форманы толтырып, QR-код жасаңыз.</p></div><div class="hidden" id="ready"><h2 id="readyTitle"></h2><img id="qrImage" alt="Викторина QR-коды"><a class="quiz-link" id="quizLink" target="_blank" rel="noopener"></a><div class="quiz-actions"><button id="copyLink" type="button">Сілтемені көшіру</button><a id="openQuiz" target="_blank" rel="noopener">Оқушы бетін ашу</a><button id="refreshResults" type="button">Нәтижені жаңарту</button></div><div class="ranking" id="ranking"></div></div></section></div></main><nav class="mobile-nav"><a href="/">Басты бет</a><a class="active" href="/tools.html">Құралдар</a><a href="/account.html">Кабинет</a></nav><div class="toast hidden" id="toast"></div><script src="/quiz-builder.js" defer></script></body></html>
