<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9A Battle</title><style>
:root{font-family:system-ui,sans-serif;color:#eff6ff;background:#0b1220}body{margin:0;padding:20px}main{max-width:1000px;margin:auto}section{background:#1a2940;border-radius:20px;padding:24px;margin:14px 0}h1{font-size:clamp(30px,5vw,58px);margin:8px 0}h2{font-size:clamp(21px,3vw,32px)}button{cursor:pointer;border:0;border-radius:12px;padding:14px 20px;font-weight:750;background:#5ed8b2;color:#081c18;font-size:17px;margin:5px}button:disabled{opacity:.4}.choice{display:block;width:100%;text-align:left;background:#31445e;color:white}.choice.selected{outline:3px solid #64d7fc}.choice.correct{background:#166b50}.scores{display:flex;gap:14px}.scores div{flex:1;background:#253b55;border-radius:14px;padding:15px;text-align:center}.scores strong{display:block;font-size:40px}.muted{color:#b6c8dd}.hide{display:none}.teacher{background:#303048}#answer{padding:16px;background:#1e4c43;border-radius:12px}</style></head><body><main><section><p class="muted">ERNUR QMJ · 9 «А»</p><h1>⚔ 9A BATTLE</h1><p>Оқушылар VS Мұғалім · Телефон, тіркелу және QR қажет емес</p><button onclick="document.documentElement.requestFullscreen?.()">Толық экран</button></section><section class="scores"><div>9 «А» оқушылары<strong id="s">0</strong></div><div>Мұғалім<strong id="t">0</strong></div></section><section id="game"><p id="meta" class="muted"></p><h2 id="question"></h2><div id="choices"></div><div id="answer" class="hide"></div><button id="reveal">Жауапты көрсету</button><div id="award" class="hide"><p>Ұпайды кімге береміз?</p><button id="studentPoint">Оқушыларға +10</button><button id="teacherPoint">Мұғалімге +10</button></div><button id="next" class="hide">Келесі сұрақ →</button></section><section id="finish" class="hide"><h2 id="winner"></h2><button onclick="location.reload()">Қайта ойнау</button></section></main><script>
const rounds=[{title:'Аниме және дорама',qs:[['Нарутоның арманы қандай?',['Хокаге болу','Дәрігер болу','Саяхаттау'],0,'Наруто Хокаге болуды армандайды.'],['Дорамадағы OST деген не?',['Сериалдың атауы','Саундтрек','Кейіпкер'],1,'OST — Original Soundtrack.'],['Какаши қай команданы басқарды?',['7-команда','10-команда','3-команда'],0,'Наруто, Саске және Сакура — 7-команда.']]},{title:'Логикалық шайқас',qs:[['Бір жылда 28 күні бар неше ай?',['1','12','2'],1,'Барлық 12 айда кемінде 28 күн бар.'],['Үш адам үш есепті үш минутта шығарса, алты адам алты есепті қанша минутта шығарады?',['3 минут','6 минут','9 минут'],0,'Әрқайсысы бір есепті үш минутта шығарады.'],['Екі әке, екі бала үш алма жеді. Қалай?',['Төрт адам','Үш адам: ата, әке, бала','Бір адам алма жемеді'],1,'Үш ұрпақ бірге отыр.']]},{title:'Құпия финал',qs:[['Досың сабақтан қалып жүр. Не істейсің?',['Мазақтаймын','Жағдайын сұраймын','Елемеймін'],1,'Досқа қолдау маңызды.'],['Команда мүшесі қателессе?',['Көмектесемін','Кінәлаймын','Шығарып жіберемін'],0,'Бір-бірімізге көмектесеміз.'],['Жеңістің кілті не?',['Бірлік','Тек бір ойыншы','Сәттілік қана'],0,'Бірлескен әрекет жеңіске жақындатады.']]}];
let r=0,q=0,selected=-1,shown=false,awarded=false,student=0,teacher=0;
const el=id=>document.getElementById(id);
function render(){const item=rounds[r].qs[q];el('meta').textContent='Раунд '+(r+1)+'/3 · '+rounds[r].title+' · Сұрақ '+(q+1)+'/3';el('question').textContent=item[0];el('choices').replaceChildren();item[1].forEach((a,i)=>{const b=document.createElement('button');b.className='choice'+(selected===i?' selected':'')+(shown&&i===item[2]?' correct':'');b.textContent='ABC'[i]+'. '+a;b.disabled=shown;b.onclick=()=>{selected=i;render()};el('choices').append(b)});el('answer').textContent='Дұрыс жауап: '+item[1][item[2]]+'. '+item[3];el('answer').classList.toggle('hide',!shown);el('reveal').classList.toggle('hide',shown);el('reveal').disabled=selected<0;el('award').classList.toggle('hide',!shown||awarded);el('next').classList.toggle('hide',!shown);el('s').textContent=student;el('t').textContent=teacher;}
el('reveal').onclick=()=>{shown=true;render()};el('studentPoint').onclick=()=>{student+=10;awarded=true;render()};el('teacherPoint').onclick=()=>{teacher+=10;awarded=true;render()};el('next').onclick=()=>{if(q<2)q++;else{q=0;r++}if(r===3){el('game').classList.add('hide');el('finish').classList.remove('hide');el('winner').textContent=student===teacher?'Достық жеңді!':student>teacher?'9 «А» жеңді!':'Мұғалім жеңді!';return}selected=-1;shown=false;awarded=false;render()};render();
</script></body></html>
