<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#246bfd"><title>Е-Тапқыр викторинасы</title><link rel="stylesheet" href="/styles.css"><style>.play{min-height:100vh;background:linear-gradient(145deg,#eef4ff,#f9fbff);padding:28px 14px}.play-card{max-width:760px;margin:auto;background:#fff;border:1px solid #dce5f4;border-radius:20px;padding:clamp(18px,4vw,34px);box-shadow:0 16px 50px rgba(31,48,91,.1)}.play-brand{font-weight:900;color:#246bfd}.student-name{margin:22px 0}.question{padding:20px 0;border-top:1px solid #e7edf7}.choices{display:grid;gap:9px;margin-top:12px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid #dbe4f2;border-radius:11px;padding:12px;cursor:pointer}.choice:has(input:checked){border-color:#246bfd;background:#edf3ff}.result{text-align:center;padding:24px}.result strong{display:block;font-size:52px;color:#246bfd}.review{margin-top:14px;text-align:left}.review p{padding:9px;border-radius:8px}.review .ok{background:#e9f9f1}.review .bad{background:#fff0f0}</style></head><body><main class="play"><section class="play-card"><div class="play-brand">Е-Тарих · Е-Тапқыр</div><div id="loading"><h1>Викторина жүктеліп жатыр...</h1></div><form class="hidden" id="playForm"><h1 id="quizTitle"></h1><p id="quizMeta"></p><label class="student-name">Оқушының аты-жөні<input id="studentName" required placeholder="Аты-жөніңіз"></label><div id="questions"></div><p class="error" id="error"></p><button class="generate" id="submitButton" type="submit">Жауапты аяқтау</button></form><section class="result hidden" id="result"></section></section></main><script src="/quiz.js" defer></script></body></html>
