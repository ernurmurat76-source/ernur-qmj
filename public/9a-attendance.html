<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9А Қатысу</title><style>body{font-family:system-ui;background:#101827;color:#f1f6ff;padding:20px}main{max-width:820px;margin:auto}section{background:#1e2c42;padding:20px;border-radius:15px;margin:15px 0}button,input{padding:12px;border-radius:8px;margin:5px}button{background:#54d3a6;border:0;cursor:pointer;font-weight:bold}input{background:#0f1b2c;color:white;border:1px solid #536580}a{color:#8cdafa}li{padding:9px;border-bottom:1px solid #43536b}small{color:#bed0e2}#qr img{background:white;padding:10px;max-width:260px}</style></head><body><main><h1>9 «А» — Қатысуды басқару</h1><p><a href="/9a-battle.html">⚔ 9A Battle ойыны</a></p><section><h2>1. Мұғалім сессиясы</h2><p>Ernur QMJ мұғалім кабинетіне кіргеннен кейін токенді осы бетке енгізіңіз. Бұл — сынақ интерфейсі.</p><input id="token" type="password" placeholder="Мұғалім токені"><button id="load">Сыныпты ашу</button><p id="message" role="status"></p></section><section id="classbox" hidden><h2>2. Сынып</h2><p id="classname"></p><button id="createClass">9 «А» сыныбын құру</button><h3>Оқушы тіркеу</h3><input id="name" placeholder="Оқушының аты-жөні"><input id="login" placeholder="Логин (латын әрпі)"><button id="add">Тіркеу</button><p id="credentials"></p><ul id="students"></ul></section><section id="sessionbox" hidden><h2>3. Күнделікті QR</h2><button id="start">2 минуттық QR жасау</button><div id="qr"></div><p><small>QR үйге жіберілсе де, мұғалім растамайынша қатысу есептелмейді.</small></p><button id="refresh">Сканерлеулерді жаңарту</button><ul id="attendance"></ul></section></main><script>
let classId=null,teacherToken='';
const e=id=>document.getElementById(id);
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','x-teacher-token':teacherToken},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Сервер қатесі');return data}
const message=x=>e('message').textContent=x;
async function load(){try{teacherToken=e('token').value.trim();const d=await api('/api/xp/classes');classId=d.classes?.[0]?.id||null;e('classbox').hidden=false;e('sessionbox').hidden=!classId;e('classname').textContent=classId?'9 «А» сыныбы ашылды':'Әзірге сынып жоқ';e('createClass').hidden=!!classId;if(classId)await students();message('Дайын')}catch(err){message(err.message)}}
async function students(){const d=await api('/api/xp/classes/'+classId+'/students');e('students').replaceChildren();d.students.forEach(s=>{const li=document.createElement('li');li.textContent=s.full_name+' ('+s.login+')';e('students').append(li)})}
e('load').onclick=load;
e('createClass').onclick=async()=>{try{await api('/api/xp/classes','POST',{});await load()}catch(err){message(err.message)}};
e('add').onclick=async()=>{try{const d=await api('/api/xp/classes/'+classId+'/students','POST',{name:e('name').value,login:e('login').value});e('credentials').textContent='Бір рет берілетін құпиясөз: '+d.password+' (қауіпсіз түрде оқушыға жеткізіңіз)';await students()}catch(err){message(err.message)}};
e('start').onclick=async()=>{try{const d=await api('/api/xp/classes/'+classId+'/sessions','POST',{});e('qr').replaceChildren();const p=document.createElement('p');p.textContent='QR коды 2 минутқа жарамды. Оқушы өз аккаунтымен кіреді.';e('qr').append(p);const a=document.createElement('a');a.href='/9a-student.html#'+d.challenge;a.textContent='Сканерлеу сілтемесі (QR-ға енгізілетін URL)';e('qr').append(a);const img=document.createElement('img');img.alt='QR';img.src='/api/xp/qr?challenge='+encodeURIComponent(d.challenge);e('qr').append(img);await attendance()}catch(err){message(err.message)}};
async function attendance(){try{const d=await api('/api/xp/classes/'+classId+'/attendance');const s=await api('/api/xp/classes/'+classId+'/students');const names=new Map(s.students.map(x=>[x.id,x.full_name]));e('attendance').replaceChildren();d.attendance.forEach(a=>{const li=document.createElement('li');const name=document.createElement('span');name.textContent=(names.get(a.student_id)||'Оқушы')+' — '+a.status+' ';li.append(name);if(a.status==='pending'){const b=document.createElement('button');b.textContent='Сыныпта отыр — растау +10 XP';b.onclick=async()=>{try{await api('/api/xp/confirm','POST',{attendanceId:a.id});await attendance()}catch(err){message(err.message)}};li.append(b)}e('attendance').append(li)})}catch(err){message(err.message)}}
e('refresh').onclick=attendance;
</script></body></html>
